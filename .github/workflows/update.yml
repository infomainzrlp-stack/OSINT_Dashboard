name: Daten aktualisieren

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Daten abrufen
        run: python3 fetch.py
        env:
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
      - name: data.json speichern
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          cp data.json /tmp/data.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.json data.json
            git add data.json
            git commit -m "Daten $(date -u +%H:%M) UTC" || exit 0
            git push && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
